server:
  port: 8081
  servlet.context-path: /tiltaksgjennomforing-varsel
  profiles:
    active: local

management.endpoints.web:
  exposure.include: info, health, metrics, prometheus
  base-path: /actuator

spring:
  application:
    name: tiltaksgjennomforing-varsel
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  kafka:
    security:
      protocol: SSL
    ssl:
      trust-store-type: JKS
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      key-store-type: PKCS12
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
    bootstrap-servers: ${KAFKA_BROKERS}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      group-id: ${spring.application.name}
      properties:
        spring:
          json:
            value.default.type: no.nav.tag.tiltaksgjennomforing.varsel.kafka.SmsVarselMelding
            trusted:
              packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

tiltaksgjennomforing:
  topics:
    sms: arbeidsgiver.tiltak-sms
    sms-resultat: arbeidsgiver.tiltak-sms-resultat
  altinn:
    base-url: http://localhost:8091
