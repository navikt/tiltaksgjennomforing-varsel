name: Bygg image

on:
  workflow_call:
    inputs:
      push-image:
        type: boolean
        required: false
        default: false
    outputs:
      image:
        description: Docker-image (settes kun ved push-image=true)
        value: ${{ jobs.build.outputs.image }}

permissions: {}

jobs:
  build:
    name: Bygg
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Oppsett Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Bygg og test med Maven
        run: mvn package -B -Dsurefire.useFile=false

      - name: Publiser Docker-image til GAR
        if: inputs.push-image
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        id: docker-build-push
        with:
          team: arbeidsgiver
